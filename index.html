<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi Stock</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171c;--mu:#6b7280;--ac:#2563eb;--bad:#dc2626;--ok:#16a34a;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#f1f3f6;--mu:#9aa3b2;--ac:#60a5fa;--bad:#f87171;--ok:#4ade80;--bd:#2a2f3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#f1f3f6;--mu:#9aa3b2;--ac:#60a5fa;--bad:#f87171;--ok:#4ade80;--bd:#2a2f3a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Helvetica,Arial,sans-serif;max-width:560px;margin-inline:auto;padding:16px}
.head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
h1{font-size:26px;margin:0}
.cloud{background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:8px 12px;font-size:13px}
.cloud.on{color:var(--ok)}.cloud.err{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mu)}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.add,.syncbox{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:12px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.syncbox{display:none;grid-template-columns:1fr}.syncbox.open{display:grid}
.syncbox p{margin:0;font-size:13px;color:var(--mu)}
.full{grid-column:1/-1}
button{font:inherit;border:0;border-radius:10px;cursor:pointer}
.primary{grid-column:1/-1;background:var(--ac);color:#fff;padding:12px;font-weight:600}
.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:10px}
label{font-size:12px;color:var(--mu)}
.photoRow{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.photoBtn{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:10px 14px}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:8px;display:flex;align-items:center;gap:10px}
.item.low{border-color:var(--bad)}
.info{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.sku{font-size:12px;color:var(--ac);font-weight:600}
.meta{font-size:12px;color:var(--mu)}
.low .meta{color:var(--bad);font-weight:600}
.ctl{display:flex;align-items:center;gap:4px}
.ctl button{width:38px;height:38px;font-size:22px;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.ctl .qty{width:auto;min-width:34px;border:0;font-size:20px;font-weight:700;background:none}
.del{background:none;color:var(--mu);font-size:18px;padding:4px}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.tools{display:flex;gap:8px;margin-top:16px}
.tools button{flex:1;padding:10px;background:var(--card);color:var(--tx);border:1px solid var(--bd);font-size:14px}
</style>
</head>
<body>
<div class="head"><h1>📦 Mi Stock</h1><button class="cloud" id="cloudBtn">☁️ Sin sincronizar</button></div>

<div class="syncbox" id="syncBox">
  <p>Para usar el mismo stock en varios celulares, pegá acá los datos de tu base de datos de Firebase. En todos los celulares tenés que poner exactamente lo mismo.</p>
  <div><label for="cu">Dirección de la base de datos (URL)</label><input id="cu" placeholder="https://xxxx-default-rtdb.firebaseio.com" autocapitalize="off" autocorrect="off"></div>
  <div><label for="cc">Código secreto (inventalo largo, sin espacios)</label><input id="cc" placeholder="Ej: mitienda-8f3k29xq7d2m" autocapitalize="off" autocorrect="off"></div>
  <button class="primary" id="cSave">Conectar</button>
  <button class="sec" id="cOff">Desconectar</button>
  <p id="cMsg"></p>
</div>

<div class="stats">
  <div class="stat"><b id="sP">0</b><span>Productos</span></div>
  <div class="stat"><b id="sU">0</b><span>Unidades</span></div>
  <div class="stat"><b id="sL">0</b><span>Stock bajo</span></div>
</div>
<input id="q" type="search" placeholder="Buscar por nombre o N.º de artículo…">
<div class="add">
  <div><label for="s">N.º de artículo</label><input id="s" placeholder="Ej: 10234" autocapitalize="characters"></div>
  <div><label for="n">Nombre</label><input id="n" placeholder="Producto"></div>
  <div><label for="c">Cantidad</label><input id="c" type="number" inputmode="numeric" value="1" min="0"></div>
  <div><label for="m">Avisar si queda menos de</label><input id="m" type="number" inputmode="numeric" value="3" min="0"></div>
  <div class="photoRow">
    <div class="thumb" id="prev">📷</div>
    <button class="photoBtn" id="pBtn">Sacar / elegir foto</button>
    <button class="photoBtn" id="pClr" style="display:none">Quitar</button>
  </div>
  <button class="primary" id="addBtn">Agregar producto</button>
</div>
<input id="file" type="file" accept="image/*" hidden>
<div id="list"></div>
<div class="tools">
  <button id="exp">Copiar copia de seguridad</button>
  <button id="imp">Restaurar copia</button>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safeId=s=>String(s).replace(/[.#$\[\]\/]/g,"_");
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function load(k,def){try{const r=localStorage.getItem(k);return r?JSON.parse(r):def;}catch(e){return def;}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){alert("No hay más espacio para guardar. Hacé una copia de seguridad y borrá fotos.");}}

let items=(load("stock-items-v2",null)||load("stock-items-v1",[])||[]).map(i=>({sku:"",photo:"",ph:0,...i,id:safeId(i.id)}));
let cfg=load("stock-sync",null);       // {url, code}
let pending=load("stock-pending",{});  // id -> "put" | "photo" | "del"
let newPhoto="",photoTarget=null,online=null,busy=false;
const save=()=>store("stock-items-v2",items);
const savePending=()=>store("stock-pending",pending);

/* ---------- Sincronización (Firebase Realtime Database, vía REST) ---------- */
const base=()=>cfg.url.replace(/\/+$/,"")+"/"+encodeURIComponent(cfg.code);
async function api(path,method,body){
  const r=await fetch(base()+path+".json",{method:method||"GET",body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}
function queue(id,op){
  if(!cfg)return;
  if(op==="del"||pending[id]==="del")pending[id]="del";
  else if(op==="photo"||pending[id]==="photo")pending[id]="photo";
  else pending[id]="put";
  savePending();sync();
}
async function flush(){
  for(const id of Object.keys(pending)){
    const op=pending[id],it=items.find(i=>i.id===id);
    if(op==="del"){await api("/items/"+id,"DELETE");await api("/photos/"+id,"DELETE");}
    else if(it){
      if(op==="photo"){if(it.photo)await api("/photos/"+id,"PUT",it.photo);else await api("/photos/"+id,"DELETE");}
      await api("/items/"+id,"PUT",{sku:it.sku,name:it.name,qty:it.qty,min:it.min,ph:it.ph||0});
    }
    delete pending[id];savePending();
  }
}
async function pull(){
  const remote=(await api("/items"))||{};
  const next=[],needPhoto=[];
  for(const id of Object.keys(remote)){
    if(pending[id]==="del")continue;
    const loc=items.find(i=>i.id===id);
    if(pending[id]&&loc){next.push(loc);continue;}
    const r=remote[id];
    const it={id,sku:r.sku||"",name:r.name||"",qty:r.qty||0,min:r.min||0,ph:r.ph||0,photo:loc?loc.photo:""};
    if(it.ph&&(!loc||loc.ph!==it.ph||!loc.photo))needPhoto.push(it);
    if(!it.ph)it.photo="";
    next.push(it);
  }
  for(const loc of items)if(!remote[loc.id]&&pending[loc.id]&&pending[loc.id]!=="del")next.push(loc);
  items=next;save();render();
  for(const it of needPhoto){
    try{const p=await api("/photos/"+it.id);if(p){it.photo=p;}}catch(e){}
  }
  if(needPhoto.length){save();render();}
}
async function sync(){
  if(!cfg||busy)return;
  busy=true;
  try{await flush();await pull();online=true;}catch(e){online=false;}
  busy=false;showStatus();
}
function showStatus(){
  const b=$("cloudBtn");
  b.className="cloud"+(cfg?(online===false?" err":" on"):"");
  b.textContent=!cfg?"☁️ Sin sincronizar":online===false?"☁️ Sin conexión":"☁️ Sincronizado";
}
setInterval(()=>{if(!document.hidden)sync();},8000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync();});

$("cloudBtn").onclick=()=>{
  $("syncBox").classList.toggle("open");
  if(cfg){$("cu").value=cfg.url;$("cc").value=cfg.code;}
};
$("cSave").onclick=async()=>{
  let url=$("cu").value.trim(),code=$("cc").value.trim();
  if(!/^https:\/\/.+/.test(url)||!code){$("cMsg").textContent="Completá la URL (empieza con https://) y el código.";return;}
  if(code.length<10){$("cMsg").textContent="El código es muy corto: usá al menos 10 caracteres.";return;}
  cfg={url,code};store("stock-sync",cfg);
  for(const it of items)pending[it.id]=it.photo?"photo":"put"; // sube lo que ya tenés
  savePending();
  $("cMsg").textContent="Conectando…";
  await sync();
  $("cMsg").textContent=online?"¡Listo! Conectado. Tus productos ya están en la nube.":"No se pudo conectar. Revisá la URL, el código y las reglas de Firebase.";
};
$("cOff").onclick=()=>{
  if(!confirm("¿Desconectar? Los productos siguen en este celular, pero ya no se sincronizan."))return;
  cfg=null;pending={};localStorage.removeItem("stock-sync");savePending();online=null;showStatus();
  $("cMsg").textContent="Desconectado.";
};

/* ---------- Fotos ---------- */
function shrink(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const S=240,k=Math.min(1,S/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",0.6));};
  img.onerror=rej;img.src=u;});}
function setPrev(){
  $("prev").innerHTML=newPhoto?`<img src="${newPhoto}" alt="">`:"📷";
  $("pClr").style.display=newPhoto?"":"none";
}
$("pBtn").onclick=$("prev").onclick=()=>{photoTarget=null;$("file").click();};
$("pClr").onclick=()=>{newPhoto="";setPrev();};
$("file").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const d=await shrink(f);
    if(photoTarget===null){newPhoto=d;setPrev();}
    else{const it=items.find(i=>i.id===photoTarget);if(it){it.photo=d;it.ph=Date.now();save();render();queue(it.id,"photo");}}
  }catch(err){alert("No se pudo leer la foto.");}
};

/* ---------- Pantalla principal ---------- */
function render(){
  const f=$("q").value.trim().toLowerCase();
  $("sP").textContent=items.length;
  $("sU").textContent=items.reduce((a,i)=>a+i.qty,0);
  $("sL").textContent=items.filter(i=>i.qty<=i.min).length;
  const shown=items.filter(i=>i.name.toLowerCase().includes(f)||i.sku.toLowerCase().includes(f)).sort((a,b)=>a.name.localeCompare(b.name));
  $("list").innerHTML=shown.length?shown.map(i=>`
    <div class="item ${i.qty<=i.min?"low":""}">
      <button class="thumb" data-a="photo" data-id="${i.id}">${i.photo?`<img src="${i.photo}" alt="">`:"📷"}</button>
      <div class="info">
        ${i.sku?`<div class="sku">N.º ${esc(i.sku)}</div>`:""}
        <div class="name">${esc(i.name)}</div>
        <div class="meta">${i.qty<=i.min?"⚠️ Stock bajo · ":""}Mínimo: ${i.min}</div>
      </div>
      <div class="ctl">
        <button data-a="dec" data-id="${i.id}">−</button>
        <button class="qty" data-a="set" data-id="${i.id}">${i.qty}</button>
        <button data-a="inc" data-id="${i.id}">+</button>
      </div>
      <button class="del" data-a="del" data-id="${i.id}">🗑</button>
    </div>`).join(""):`<div class="empty">${items.length?"Sin resultados":"Todavía no cargaste productos"}</div>`;
}
$("addBtn").onclick=()=>{
  const sku=$("s").value.trim().toUpperCase().replace(/^-+|-+$/g,""),name=$("n").value.trim();
  const qty=Math.max(0,parseInt($("c").value)||0),min=Math.max(0,parseInt($("m").value)||0);
  if(!sku&&!name)return $("s").focus();
  const ex=sku&&items.find(i=>i.sku.toLowerCase()===sku.toLowerCase());
  let id;
  if(ex){
    ex.qty+=qty;if(name)ex.name=name;
    if(newPhoto){ex.photo=newPhoto;ex.ph=Date.now();}
    id=ex.id;alert("El artículo "+sku+" ya existía: se sumaron "+qty+" unidades.");
  }else{
    id=newId();
    items.push({id,sku,name:name||("Artículo "+sku),qty,min,photo:newPhoto,ph:newPhoto?Date.now():0});
  }
  const hadPhoto=!!newPhoto;
  $("s").value="";$("n").value="";$("c").value=1;newPhoto="";setPrev();save();render();
  queue(id,hadPhoto?"photo":"put");
};
$("s").addEventListener("input",()=>{
  const el=$("s");
  const fixed=el.value.replace(/\s+/g,"-").toUpperCase();
  if(el.value!==fixed)el.value=fixed;
  const v=el.value.trim().toLowerCase();if(!v)return;
  const ex=items.find(i=>i.sku.toLowerCase()===v);if(ex&&!$("n").value)$("n").value=ex.name;
});
$("list").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  const it=items.find(i=>i.id===b.dataset.id);if(!it)return;
  const a=b.dataset.a;let op="put";
  if(a==="inc")it.qty++;
  else if(a==="dec")it.qty=Math.max(0,it.qty-1);
  else if(a==="set"){const v=prompt("Cantidad de "+it.name,it.qty);if(v===null)return;it.qty=Math.max(0,parseInt(v)||0);}
  else if(a==="photo"){photoTarget=it.id;$("file").click();return;}
  else if(a==="del"){if(!confirm("¿Borrar “"+it.name+"”?"))return;items=items.filter(i=>i!==it);op="del";}
  save();render();queue(it.id,op);
};
$("q").oninput=render;
$("exp").onclick=async()=>{
  const t=JSON.stringify(items);
  try{await navigator.clipboard.writeText(t);alert("Copia guardada en el portapapeles. Pegala en Notas para respaldarla.");}
  catch(e){prompt("Copiá este texto:",t);}
};
$("imp").onclick=()=>{
  const t=prompt("Pegá tu copia de seguridad:");if(!t)return;
  try{
    const d=JSON.parse(t);if(!Array.isArray(d))throw 0;
    const nuevos=d.map(i=>({sku:"",photo:"",ph:0,...i,id:safeId(i.id)}));
    for(const o of items)if(!nuevos.find(n=>n.id===o.id))queue(o.id,"del");
    items=nuevos;save();render();
    for(const n of items)queue(n.id,n.photo?"photo":"put");
  }catch(e){alert("La copia no es válida.");}
};
render();showStatus();sync();
</script>
</body>
</html>
