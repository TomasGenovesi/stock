<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi Stock</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171c;--mu:#6b7280;--ac:#2563eb;--bad:#dc2626;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#f1f3f6;--mu:#9aa3b2;--ac:#60a5fa;--bad:#f87171;--bd:#2a2f3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#f1f3f6;--mu:#9aa3b2;--ac:#60a5fa;--bad:#f87171;--bd:#2a2f3a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Helvetica,Arial,sans-serif;max-width:560px;margin-inline:auto;padding:16px}
h1{font-size:26px;margin:4px 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mu)}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.add{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:12px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.full{grid-column:1/-1}
button{font:inherit;border:0;border-radius:10px;cursor:pointer}
.primary{grid-column:1/-1;background:var(--ac);color:#fff;padding:12px;font-weight:600}
label{font-size:12px;color:var(--mu)}
.photoRow{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.photoBtn{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:10px 14px}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--bg);border:1px solid var(--bd);flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:8px;display:flex;align-items:center;gap:10px}
.item.low{border-color:var(--bad)}
.info{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.sku{font-size:12px;color:var(--ac);font-weight:600}
.meta{font-size:12px;color:var(--mu)}
.low .meta{color:var(--bad);font-weight:600}
.ctl{display:flex;align-items:center;gap:4px}
.ctl button{width:38px;height:38px;font-size:22px;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.ctl .qty{width:auto;min-width:34px;border:0;font-size:20px;font-weight:700;background:none}
.del{background:none;color:var(--mu);font-size:18px;padding:4px}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.tools{display:flex;gap:8px;margin-top:16px}
.tools button{flex:1;padding:10px;background:var(--card);color:var(--tx);border:1px solid var(--bd);font-size:14px}
</style>
</head>
<body>
<h1>📦 Mi Stock</h1>
<div class="stats">
  <div class="stat"><b id="sP">0</b><span>Productos</span></div>
  <div class="stat"><b id="sU">0</b><span>Unidades</span></div>
  <div class="stat"><b id="sL">0</b><span>Stock bajo</span></div>
</div>
<input id="q" type="search" placeholder="Buscar por nombre o N.º de artículo…">
<div class="add">
  <div><label for="s">N.º de artículo</label><input id="s" placeholder="Ej: 10234" autocapitalize="characters"></div>
  <div><label for="n">Nombre</label><input id="n" placeholder="Producto"></div>
  <div><label for="c">Cantidad</label><input id="c" type="number" inputmode="numeric" value="1" min="0"></div>
  <div><label for="m">Avisar si queda menos de</label><input id="m" type="number" inputmode="numeric" value="3" min="0"></div>
  <div class="photoRow">
    <div class="thumb" id="prev">📷</div>
    <button class="photoBtn" id="pBtn">Sacar / elegir foto</button>
    <button class="photoBtn" id="pClr" style="display:none">Quitar</button>
  </div>
  <button class="primary" id="addBtn">Agregar producto</button>
</div>
<input id="file" type="file" accept="image/*" hidden>
<div id="list"></div>
<div class="tools">
  <button id="exp">Copiar copia de seguridad</button>
  <button id="imp">Restaurar copia</button>
</div>

<script>
let items=[],newPhoto="",photoTarget=null;
const KEY="stock-items-v2";
try{const r=localStorage.getItem(KEY)||localStorage.getItem("stock-items-v1");if(r)items=(JSON.parse(r)||[]).map(i=>({sku:"",photo:"",...i}));}catch(e){items=[];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){alert("No hay más espacio para guardar. Hacé una copia de seguridad y borrá fotos.");}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function shrink(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const S=240,k=Math.min(1,S/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",0.6));};
  img.onerror=rej;img.src=u;});}

function setPrev(){
  $("prev").innerHTML=newPhoto?`<img src="${newPhoto}" alt="">`:"📷";
  $("pClr").style.display=newPhoto?"":"none";
}
$("pBtn").onclick=$("prev").onclick=()=>{photoTarget=null;$("file").click();};
$("pClr").onclick=()=>{newPhoto="";setPrev();};
$("file").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const d=await shrink(f);
    if(photoTarget===null){newPhoto=d;setPrev();}
    else{const it=items.find(i=>String(i.id)===photoTarget);if(it){it.photo=d;save();render();}}
  }catch(err){alert("No se pudo leer la foto.");}
};

function render(){
  const f=$("q").value.trim().toLowerCase();
  $("sP").textContent=items.length;
  $("sU").textContent=items.reduce((a,i)=>a+i.qty,0);
  $("sL").textContent=items.filter(i=>i.qty<=i.min).length;
  const shown=items.filter(i=>i.name.toLowerCase().includes(f)||i.sku.toLowerCase().includes(f)).sort((a,b)=>a.name.localeCompare(b.name));
  $("list").innerHTML=shown.length?shown.map(i=>`
    <div class="item ${i.qty<=i.min?"low":""}">
      <button class="thumb" data-a="photo" data-id="${i.id}">${i.photo?`<img src="${i.photo}" alt="">`:"📷"}</button>
      <div class="info">
        ${i.sku?`<div class="sku">N.º ${esc(i.sku)}</div>`:""}
        <div class="name">${esc(i.name)}</div>
        <div class="meta">${i.qty<=i.min?"⚠️ Stock bajo · ":""}Mínimo: ${i.min}</div>
      </div>
      <div class="ctl">
        <button data-a="dec" data-id="${i.id}">−</button>
        <button class="qty" data-a="set" data-id="${i.id}">${i.qty}</button>
        <button data-a="inc" data-id="${i.id}">+</button>
      </div>
      <button class="del" data-a="del" data-id="${i.id}">🗑</button>
    </div>`).join(""):`<div class="empty">${items.length?"Sin resultados":"Todavía no cargaste productos"}</div>`;
}

$("addBtn").onclick=()=>{
  const sku=$("s").value.trim(),name=$("n").value.trim();
  const qty=Math.max(0,parseInt($("c").value)||0),min=Math.max(0,parseInt($("m").value)||0);
  if(!sku&&!name)return $("s").focus();
  const ex=sku&&items.find(i=>i.sku.toLowerCase()===sku.toLowerCase());
  if(ex){ // artículo ya cargado: suma unidades
    ex.qty+=qty;if(name)ex.name=name;if(newPhoto)ex.photo=newPhoto;
    alert("El artículo "+sku+" ya existía: se sumaron "+qty+" unidades.");
  }else{
    items.push({id:Date.now()+Math.random(),sku,name:name||("Artículo "+sku),qty,min,photo:newPhoto});
  }
  $("s").value="";$("n").value="";$("c").value=1;newPhoto="";setPrev();save();render();
};
$("s").addEventListener("input",()=>{ // autocompleta si el N.º ya existe
  const v=$("s").value.trim().toLowerCase();if(!v)return;
  const ex=items.find(i=>i.sku.toLowerCase()===v);if(ex&&!$("n").value)$("n").value=ex.name;
});
$("list").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  const it=items.find(i=>String(i.id)===b.dataset.id);if(!it)return;
  const a=b.dataset.a;
  if(a==="inc")it.qty++;
  else if(a==="dec")it.qty=Math.max(0,it.qty-1);
  else if(a==="set"){const v=prompt("Cantidad de "+it.name,it.qty);if(v===null)return;it.qty=Math.max(0,parseInt(v)||0);}
  else if(a==="photo"){photoTarget=b.dataset.id;$("file").click();return;}
  else if(a==="del"){if(!confirm("¿Borrar “"+it.name+"”?"))return;items=items.filter(i=>i!==it);}
  save();render();
};
$("q").oninput=render;
$("exp").onclick=async()=>{
  const t=JSON.stringify(items);
  try{await navigator.clipboard.writeText(t);alert("Copia guardada en el portapapeles. Pegala en Notas para respaldarla.");}
  catch(e){prompt("Copiá este texto:",t);}
};
$("imp").onclick=()=>{
  const t=prompt("Pegá tu copia de seguridad:");if(!t)return;
  try{const d=JSON.parse(t);if(!Array.isArray(d))throw 0;items=d.map(i=>({sku:"",photo:"",...i}));save();render();}catch(e){alert("La copia no es válida.");}
};
render();
</script>
</body>
</html>
